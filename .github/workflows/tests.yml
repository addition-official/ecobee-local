name: Tests

# Runs the test suite on every push to main and every pull request,
# but only when code, tests or packaging change (README edits skip it).
# No thermostat, MQTT broker or network access is needed.

on:
  push:
    branches: [main]
    paths:
      - "ecobee_local/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "ecobee_local/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"

# read-only token unless a job asks for more
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # let every Python version finish even if one fails
      fail-fast: false
      matrix:
        # oldest and newest that GitHub's runners still provide
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install ".[mqtt]" pytest

      - name: Run tests
        run: python -m pytest -v
